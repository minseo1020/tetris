<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>귀여운 노랑 테트리스 🐥</title>
    <!-- 귀여운 폰트 로드 (Neo둥근모 & Gowun Dodum) -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FFFBE6;
            --main-yellow: #FFE867;
            --point-orange: #FFB84C;
            --dark-text: #5F5241;
            --card-bg: #FFFFFF;
            --border-color: #F7D070;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Gowun Dodum', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--dark-text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(247, 208, 112, 0.4);
            border: 4px solid var(--border-color);
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .main-board {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 24px;
            color: #E59866;
            margin-bottom: 15px;
            text-shadow: 1px 1px 0px #FFF;
        }

        canvas#tetris {
            border: 4px solid var(--main-yellow);
            border-radius: 15px;
            background-color: #FFFDF4;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.03);
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 130px;
        }

        .info-box {
            background: #FFF9E6;
            border: 3px solid var(--main-yellow);
            border-radius: 15px;
            padding: 12px;
            text-align: center;
        }

        .info-box h2 {
            font-size: 14px;
            color: #D4AC0D;
            margin-bottom: 5px;
        }

        .info-box div {
            font-size: 20px;
            font-weight: bold;
            color: var(--dark-text);
        }

        canvas#next {
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            background: #FFF;
            margin-top: 5px;
        }

        .btn-start {
            background: var(--point-orange);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #E59866;
            transition: all 0.1s ease;
        }

        .btn-start:hover {
            background: #FFA04C;
        }

        .btn-start:active {
            box-shadow: 0 0 0 #E59866;
            transform: translateY(4px);
        }

        .controls-hint {
            font-size: 11px;
            color: #A69684;
            line-height: 1.5;
            background: #FAF7F0;
            padding: 10px;
            border-radius: 10px;
        }

        .game-over-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 251, 230, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 25px;
            font-size: 24px;
            font-weight: bold;
            color: #E59866;
            visibility: hidden;
        }
    </style>
</head>
<body>

<div class="game-container" style="position: relative;">
    <div class="main-board">
        <h1>🐥 말랑말랑 테트리스 🐥</h1>
        <canvas id="tetris" width="240" height="400"></canvas>
    </div>

    <div class="side-panel">
        <div class="info-box">
            <h2>SCORE</h2>
            <div id="score">0</div>
        </div>

        <div class="info-box">
            <h2>NEXT</h2>
            <canvas id="next" width="80" height="80"></canvas>
        </div>

        <button class="btn-start" onclick="startGame()">게임 시작!</button>

        <div class="controls-hint">
            <strong>조작 방법</strong><br>
            ← → : 이동<br>
            ↑ : 회전<br>
            ↓ : 빨리 내리기<br>
            Space : 바로 떨어뜨리기
        </div>
    </div>

    <div id="game-over" class="game-over-overlay">
        <div>GAME OVER 😭</div>
        <button class="btn-start" style="margin-top: 15px;" onclick="startGame()">다시하기</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next');
    const nextContext = nextCanvas.getContext('2d');

    context.scale(20, 20);
    nextContext.scale(20, 20);

    // 노란색 & 파스텔 톤 테마 블록 색상
    const colors = [
        null,
        '#FFE162', // I (밝은 노랑)
        '#FFB100', // L (오렌지 노랑)
        '#FFD93D', // J (바나나 노랑)
        '#F4E06D', // O (버터 노랑)
        '#F7AD19', // S (귤색)
        '#D8B384', // T (크림 브라운)
        '#FCE38A'  // Z (연노랑)
    ];

    // 블록 모양 (7종)
    function createPiece(type) {
        if (type === 'I') {
            return [
                [0, 1, 0, 0],
                [0, 1, 0, 0],
                [0, 1, 0, 0],
                [0, 1, 0, 0],
            ];
        } else if (type === 'L') {
            return [
                [0, 2, 0],
                [0, 2, 0],
                [0, 2, 2],
            ];
        } else if (type === 'J') {
            return [
                [0, 3, 0],
                [0, 3, 0],
                [3, 3, 0],
            ];
        } else if (type === 'O') {
            return [
                [4, 4],
                [4, 4],
            ];
        } else if (type === 'S') {
            return [
                [0, 5, 5],
                [5, 5, 0],
                [0, 0, 0],
            ];
        } else if (type === 'T') {
            return [
                [0, 0, 0],
                [6, 6, 6],
                [0, 6, 0],
            ];
        } else if (type === 'Z') {
            return [
                [7, 7, 0],
                [0, 7, 7],
                [0, 0, 0],
            ];
        }
    }

    const arena = createMatrix(12, 20);

    const player = {
        pos: {x: 0, y: 0},
        matrix: null,
        nextMatrix: null,
        score: 0
    };

    function createMatrix(w, h) {
        const matrix = [];
        while (h--) {
            matrix.push(new Array(w).fill(0));
        }
        return matrix;
    }

    // 둥글둥글한 블록 그리기
    function drawMatrix(matrix, offset, ctx) {
        matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    ctx.fillStyle = colors[value];
                    // 둥근 사각형 그리기로 귀여움 연출
                    ctx.beginPath();
                    ctx.roundRect(x + offset.x + 0.05, y + offset.y + 0.05, 0.9, 0.9, 0.2);
                    ctx.fill();
                    
                    // 하이라이트 (입체감)
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.beginPath();
                    ctx.roundRect(x + offset.x + 0.15, y + offset.y + 0.15, 0.3, 0.3, 0.1);
                    ctx.fill();
                }
            });
        });
    }

    function draw() {
        context.fillStyle = '#FFFDF4';
        context.fillRect(0, 0, canvas.width, canvas.height);

        drawMatrix(arena, {x: 0, y: 0}, context);
        if (player.matrix) {
            drawMatrix(player.matrix, player.pos, context);
        }
    }

    function drawNext() {
        nextContext.fillStyle = '#FFFFFF';
        nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
        if (player.nextMatrix) {
            // 다음 블록 중앙 정렬
            const xOffset = (4 - player.nextMatrix[0].length) / 2;
            const yOffset = (4 - player.nextMatrix.length) / 2;
            drawMatrix(player.nextMatrix, {x: xOffset, y: yOffset}, nextContext);
        }
    }

    function collide(arena, player) {
        const [m, o] = [player.matrix, player.pos];
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 &&
                   (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                    return true;
                }
            }
        }
        return false;
    }

    function merge(arena, player) {
        player.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    arena[y + player.pos.y][x + player.pos.x] = value;
                }
            });
        });
    }

    function arenaSweep() {
        let rowCount = 1;
        outer: for (let y = arena.length - 1; y > 0; --y) {
            for (let x = 0; x < arena[y].length; ++x) {
                if (arena[y][x] === 0) {
                    continue outer;
                }
            }
            const row = arena.splice(y, 1)[0].fill(0);
            arena.unshift(row);
            ++y;

            player.score += rowCount * 10;
            rowCount *= 2;
        }
        updateScore();
    }

    function playerDrop() {
        player.pos.y++;
        if (collide(arena, player)) {
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
        }
        dropCounter = 0;
    }

    function playerHardDrop() {
        while (!collide(arena, player)) {
            player.pos.y++;
        }
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
        dropCounter = 0;
    }

    function playerMove(dir) {
        player.pos.x += dir;
        if (collide(arena, player)) {
            player.pos.x -= dir;
        }
    }

    function playerRotate(dir) {
        const pos = player.pos.x;
        let offset = 1;
        rotate(player.matrix, dir);
        while (collide(arena, player)) {
            player.pos.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (offset > player.matrix[0].length) {
                rotate(player.matrix, -dir);
                player.pos.x = pos;
                return;
            }
        }
    }

    function rotate(matrix, dir) {
        for (let y = 0; y < matrix.length; ++y) {
            for (let x = 0; x < y; ++x) {
                [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
            }
        }
        if (dir > 0) {
            matrix.forEach(row => row.reverse());
        } else {
            matrix.reverse();
        }
    }

    function getRandomPiece() {
        const pieces = 'IJLOSTZ';
        return createPiece(pieces[pieces.length * Math.random() | 0]);
    }

    function playerReset() {
        if (!player.nextMatrix) {
            player.nextMatrix = getRandomPiece();
        }
        player.matrix = player.nextMatrix;
        player.nextMatrix = getRandomPiece();
        player.pos.y = 0;
        player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

        drawNext();

        if (collide(arena, player)) {
            gameOver();
        }
    }

    function gameOver() {
        gameRunning = false;
        document.getElementById('game-over').style.visibility = 'visible';
    }

    function updateScore() {
        document.getElementById('score').innerText = player.score;
    }

    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;
    let gameRunning = false;

    function update(time = 0) {
        if (!gameRunning) return;

        const deltaTime = time - lastTime;
        lastTime = time;

        dropCounter += deltaTime;
        if (dropCounter > dropInterval) {
            playerDrop();
        }

        draw();
        requestAnimationFrame(update);
    }

    function startGame() {
        arena.forEach(row => row.fill(0));
        player.score = 0;
        updateScore();
        document.getElementById('game-over').style.visibility = 'hidden';
        player.nextMatrix = null;
        playerReset();
        gameRunning = true;
        lastTime = performance.now();
        update();
    }

    document.addEventListener('keydown', event => {
        if (!gameRunning) return;

        if (event.keyCode === 37) { // Left
            playerMove(-1);
        } else if (event.keyCode === 39) { // Right
            playerMove(1);
        } else if (event.keyCode === 40) { // Down
            playerDrop();
        } else if (event.keyCode === 38) { // Up (Rotate)
            playerRotate(1);
        } else if (event.keyCode === 32) { // Space (Hard drop)
            event.preventDefault(); // 스크롤 방지
            playerHardDrop();
        }
    });

    // 초기에 빈 화면 렌더링
    draw();
    drawNext();
</script>
</body>
</html>
